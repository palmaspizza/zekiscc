<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Degradado de Fondo -->
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#e1002d" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#080808" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030303" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="vinylCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1002d"/>
      <stop offset="60%" stop-color="#800018"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Filtros de Brillo Neón -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Trama Urbana -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="630" fill="#030303"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Líneas diagonales de estilo urbano -->
  <path d="M -100 500 L 1300 -100" stroke="#e1002d" stroke-width="120" stroke-opacity="0.08"/>
  <path d="M -100 580 L 1300 -20" stroke="#f4f4f4" stroke-width="8" stroke-opacity="0.15"/>

  <!-- Gráfico Disco Vinilo (Lado Derecho) -->
  <g transform="translate(920, 315)">
    <circle cx="0" cy="0" r="260" fill="none" stroke="#e1002d" stroke-width="4" filter="url(#glow)" opacity="0.6"/>
    <circle cx="0" cy="0" r="250" fill="#0d0d0d" stroke="#222" stroke-width="2"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="#1a1a1a" stroke-width="15"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#161616" stroke-width="20"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e1e1e" stroke-width="10"/>
    <circle cx="0" cy="0" r="80" fill="url(#vinylCenter)" stroke="#f4f4f4" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#030303"/>
    <path d="M -250 0 A 250 250 0 0 1 0 -250 L 0 0 Z" fill="#ffffff" opacity="0.04"/>
    <path d="M 0 250 A 250 250 0 0 1 250 0 L 0 0 Z" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- Etiqueta superior -->
  <g transform="translate(90, 115)">
    <rect x="0" y="0" width="230" height="38" fill="#f4f4f4" transform="rotate(-2)"/>
    <text x="15" y="25" font-family="'Impact', 'Anton', sans-serif" font-size="18" font-weight="bold" fill="#000000" letter-spacing="3" transform="rotate(-2)">NUEVO EN LA CALLE</text>
  </g>

  <!-- Título Principal: ZEKISCC -->
  <text x="84" y="272" font-family="'Impact', 'Anton', sans-serif" font-size="128" font-weight="900" fill="#e1002d" letter-spacing="4" filter="url(#textGlow)">ZEKISCC</text>
  <text x="94" y="268" font-family="'Impact', 'Anton', sans-serif" font-size="128" font-weight="900" fill="none" stroke="#f4f4f4" stroke-width="3" letter-spacing="4" opacity="0.7">ZEKISCC</text>
  <text x="90" y="270" font-family="'Impact', 'Anton', sans-serif" font-size="128" font-weight="900" fill="#ffffff" letter-spacing="4">ZEKISCC</text>

  <!-- Cinta Ticker con géneros -->
  <rect x="90" y="310" width="620" height="42" fill="#111111" stroke="#e1002d" stroke-width="2" rx="4"/>
  <text x="110" y="337" font-family="'Impact', 'Anton', sans-serif" font-size="22" fill="#f4f4f4" letter-spacing="3">
    REGGAETON <tspan fill="#e1002d">•</tspan> TRAP <tspan fill="#e1002d">•</tspan> CALLE <tspan fill="#e1002d">•</tspan> MÚSICA OFICIAL
  </text>

  <!-- Slogan -->
  <text x="90" y="405" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#e1002d">
    "DEL BARRIO PA' EL MUNDO"
  </text>

  <!-- Ecualizador -->
  <g transform="translate(90, 460)">
    <rect x="0" y="10" width="8" height="40" fill="#e1002d" rx="2"/>
    <rect x="14" y="0" width="8" height="50" fill="#f4f4f4" rx="2"/>
    <rect x="28" y="20" width="8" height="30" fill="#e1002d" rx="2"/>
    <rect x="42" y="5" width="8" height="45" fill="#f4f4f4" rx="2"/>
    <rect x="56" y="25" width="8" height="25" fill="#e1002d" rx="2"/>
    <rect x="70" y="12" width="8" height="38" fill="#f4f4f4" rx="2"/>
    <rect x="84" y="2" width="8" height="48" fill="#e1002d" rx="2"/>
    <rect x="98" y="18" width="8" height="32" fill="#f4f4f4" rx="2"/>
  </g>

  <!-- Badge con el Dominio -->
  <rect x="220" y="468" width="280" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="360" y="492" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">zekiscc.pages.dev</text>

  <!-- Marco Borde Exterior -->
  <rect x="15" y="15" width="1170" height="600" fill="none" stroke="#e1002d" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="23" y="23" width="1154" height="584" fill="none" stroke="#f4f4f4" stroke-opacity="0.2" stroke-width="1"/>
</svg>
