<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradados -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40"/>
      <stop offset="100%" stop-color="#e1002d"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>

    <!-- Sombra neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#e1002d" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Oscura con Bordes Redondeados -->
  <rect width="512" height="512" rx="100" fill="#030303"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#e1002d" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Trama Urbana de Fondo -->
  <path d="M 0 120 L 120 0 M 0 250 L 250 0 M 0 380 L 380 0 M 130 512 L 512 130 M 260 512 L 512 260 M 390 512 L 512 390" stroke="#ffffff" stroke-opacity="0.04" stroke-width="8"/>

  <!-- Isotipo ZEKISCC ("Z" de Calle) -->
  <g filter="url(#neonGlow)">
    <!-- Barra Superior -->
    <path d="M 100 110 L 412 110 L 342 190 L 100 190 Z" fill="url(#redGrad)"/>

    <!-- Diagonal Principal -->
    <path d="M 372 130 L 180 382 L 100 382 L 292 130 Z" fill="url(#whiteGrad)"/>
    <path d="M 412 130 L 220 382 L 260 382 L 412 190 Z" fill="url(#redGrad)"/>

    <!-- Barra Inferior -->
    <path d="M 100 322 L 170 402 L 412 402 L 412 322 Z" fill="url(#whiteGrad)"/>

    <!-- Cortes estilo Ecualizador / Slash -->
    <polygon points="380,225 420,225 390,285 350,285" fill="#e1002d"/>
    <polygon points="120,225 160,225 130,285 90,285" fill="#ffffff"/>
  </g>

  <!-- Puntos Neón de Acento -->
  <circle cx="425" cy="110" r="14" fill="#e1002d"/>
  <circle cx="87" cy="402" r="14" fill="#ffffff"/>
</svg>
