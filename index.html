<div id="L"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getDatabase,ref,onValue,get,runTransaction} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyCuHSlv7WEmoEWh96rWWCnTi7AwgN-7Hd4",authDomain:"tatuajes-e7c8f.firebaseapp.com",databaseURL:"https://tatuajes-e7c8f-default-rtdb.firebaseio.com/",projectId:"tatuajes-e7c8f"}));
const C0={name:'ZEKISCC',tag:'Nuevo en la calle',slogan:"Del barrio pa' el mundo.",btn:'Escucha lo último',mq:'ZEKISCC • REGGAETON • TRAP • CALLE',latestT:'Último lanzamiento',songsT:'Temas',albumsT:'Álbumes',aboutT:'Quién es',aboutX:'',ig:'ZEKISCC',wa:'',foot:'Hecho en la calle.',videosT:'Videoclips',galleryT:'Fotos',showsT:'Próximos shows',tiktok:'',email:'',cdT:'Nuevo tema en',cdD:'',portrait:'',cA:'#e1002d',cB:'#f4f4f4',hero:''};
let D={config:{},songs:{},albums:{},photos:{},videos:{},shows:{}};const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const cov=s=>s.cover||(s.yt?`https://i.ytimg.com/vi/${s.yt}/hqdefault.jpg`:'');
const img=(s,n)=>{const c=cov(s);return c?`<img loading="lazy" src="${esc(c)}" alt="">`:`<div class="ph">${esc((n||s.title||'♪')[0])}</div>`};
const an=s=>D.albums[s.album]?.name||'Sencillo';
const songs=()=>Object.entries(D.songs).map(([id,s])=>({id,...s})).sort((x,y)=>(y.date||0)-(x.date||0));
const S=[],L=$('L');
const show=()=>{const h=S[S.length-1];L.classList.toggle('on',!!h);document.body.style.overflow=h?'hidden':'';L.innerHTML=h?`<div class="box"><button class="x" onclick="history.back()">${ic('x')}</button>${h}</div>`:''};
const open=h=>{if(window.au)au.pause();S.push(h);history.pushState(1,'');show()};
addEventListener('popstate',()=>{S.pop();show()});
L.onclick=e=>{if(e.target===L)history.back()};
window.song=id=>{const s=D.songs[id];if(!s)return;
const v=s.yt?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${s.yt}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div>`:(cov(s)?`<img class="cv" src="${esc(cov(s))}" alt="">`:'');
const k=(u,c,i,t)=>u?`<a class="bt ${c}" href="${esc(u)}" target="_blank" rel="noopener">${ic(i)}${t}</a>`:'';
const b=k(s.spotify,'sp','sp','Spotify')+k(s.soundcloud,'sc','sc','SoundCloud')+k(s.yt&&'https://youtu.be/'+s.yt,'yt','yt','YouTube');
open(`${v}<h2>${esc(s.title)}</h2><p style="color:#999">${esc(an(s))}</p><div class="bts">${b||'<p>Muy pronto en plataformas.</p>'}</div><button class="bt sh" onclick="share('${esc(s.title).replace(/'/g,'')}')">${ic('sh')}Compartir</button>`)};
window.album=id=>{const a=D.albums[id],t=songs().filter(s=>s.album===id).reverse();
open(`${a.cover?`<img class="cv" src="${esc(a.cover)}" alt="">`:''}<h2>${esc(a.name)}</h2><p style="color:#999;margin-bottom:10px">${esc(a.year||'')}</p>${t.map((s,i)=>`<div class="trk" onclick="song('${s.id}')"><span>${i+1}. ${esc(s.title)}</span>${ic('play')}</div>`).join('')||'<p>Sin temas todavía.</p>'}`)};
window.share=t=>navigator.share?navigator.share({title:t,url:location.href}).catch(()=>{}):navigator.clipboard.writeText(location.href).then(()=>alert('Link copiado'));
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('v')),{threshold:.08});
window.render=()=>{const c={...C0,...D.config},q=$('q').value.toLowerCase(),all=songs(),r=document.documentElement.style;
r.setProperty('--a',c.cA);r.setProperty('--b',c.cB);document.title=c.name+' | Música oficial';
$('nm').textContent=$('lg').textContent=$('ldn').textContent=$('fn').textContent=c.name;$('nm').dataset.t=c.name;const nl=Math.max(4,c.name.length);$('nm').style.fontSize=`min(${Math.min(27,170/nl).toFixed(1)}vw,15rem)`;$('fn').style.fontSize=`min(${Math.min(32,200/nl).toFixed(1)}vw,18rem)`;$('ldn').style.fontSize=`min(${Math.min(18,110/nl).toFixed(1)}vw,9rem)`;
$('tag').innerHTML=`<span class="eq"><i></i><i></i><i></i><i></i></span>${esc(c.tag)}`;$('sl').textContent=c.slogan;$('btn').textContent=c.btn;
$('stt').textContent=(c.name+' ✦ ').repeat(4).slice(0,44);
$('st').textContent=c.songsT;$('at').textContent=c.albumsT;$('abt').textContent=c.aboutT;$('abx').textContent=c.aboutX;$('pt').src=c.portrait||'';$('pt').hidden=!c.portrait;$('abw').classList.toggle('p',!!c.portrait);$('about').hidden=!c.aboutX&&!c.portrait;$('ft').textContent=c.foot;
$('hero').style.backgroundImage=c.hero?`linear-gradient(#0003,#030303 96%),url("${c.hero}")`:'';
const h=c.ig.replace('@','');$('ign').href=$('ig2').href='https://instagram.com/'+h;$('igt').textContent=$('ig2t').textContent='@'+h;
const w=String(c.wa||'').replace(/\D/g,'');$('wa').hidden=!w;if(w)$('wa').href='https://wa.me/'+w;
const it=c.mq.split(/[•|·]/).map(x=>x.trim()).filter(Boolean),m=it.map(x=>`<span>${esc(x)}</span>${ic('st').replace('class="ic"','class="ic st"')}`).join('').repeat(Math.ceil(10/it.length));document.querySelectorAll('.m').forEach(e=>e.innerHTML=m+m);
const f=all[0];$('latest').hidden=!f;window.lastId=f?.id;
if(f){$('latest').innerHTML=`<h2>${esc(c.latestT)}</h2><div class="feat" onclick="song('${f.id}')"><div class="vinyl"></div><div class="im">${img(f)}<div class="pl">${ic('play')}</div></div><div><h3>${esc(f.title)}</h3><p style="color:#aaa;margin-top:10px">${esc(an(f))}</p></div></div>`;
$('cta').onclick=()=>song(f.id);$('bt').textContent='▶ '+f.title}else $('cta').onclick=()=>$('sg').scrollIntoView();
const l=all.filter(s=>s.title.toLowerCase().includes(q));
$('gs').innerHTML=l.map((s,i)=>`<div class="card tl" onclick="song('${s.id}')"><div class="im">${i===0&&!q?'<span class="new">NUEVO</span>':''}${img(s)}<div class="pl">${ic('play')}</div></div><h3>${esc(s.title)}</h3><p>${esc(an(s))}</p></div>`).join('')||'<p>Muy pronto. Los temas caen acá.</p>';
const al=Object.entries(D.albums);$('alb').hidden=!al.length;
$('ga').innerHTML=al.map(([id,a])=>`<div class="card tl" onclick="album('${id}')"><div class="im">${a.cover?`<img loading="lazy" src="${esc(a.cover)}" alt="">`:`<div class="ph">${esc(a.name[0])}</div>`}</div><h3>${esc(a.name)}</h3><p>${esc(a.year||'')}</p></div>`).join('');
$('vdT').textContent=c.videosT;$('glT').textContent=c.galleryT;$('swT').textContent=c.showsT;
const V=Object.entries(D.videos).reverse();$('vd').hidden=!V.length;
$('vg').innerHTML=V.map(([id,v])=>`<div class="card" onclick="vid('${id}')"><div class="im" style="aspect-ratio:16/9"><img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.yt)}/hqdefault.jpg" alt=""><div class="pl">${ic('play')}</div></div><h3>${esc(v.title)}</h3></div>`).join('');
const td=new Date().toISOString().slice(0,10),SH=Object.values(D.shows).filter(s=>s.date>=td).sort((a,b)=>a.date.localeCompare(b.date));$('sw').hidden=!SH.length;
$('swl').innerHTML=SH.map(s=>{const d=new Date(s.date+'T12:00');return`<div class="show card"><div class="dt"><b>${d.getDate()}</b><span>${d.toLocaleString('es',{month:'short'})}</span></div><div class="si"><h3>${esc(s.city)}</h3><p>${ic('pn')} ${esc(s.venue||'')}</p></div>${s.link?`<a class="pill" href="${esc(s.link)}" target="_blank" rel="noopener">Entradas</a>`:''}</div>`}).join('');
const P=Object.entries(D.photos).reverse();$('gl').hidden=!P.length;
$('gll').innerHTML=P.map(([id,p])=>`<img class="card" loading="lazy" onclick="photo('${id}')" src="${esc(p.src)}" alt="">`).join('');
const tk=String(c.tiktok||'').replace('@','');$('tkp').hidden=!tk;if(tk)$('tkp').href='https://tiktok.com/@'+tk;
$('mlp').hidden=!c.email;if(c.email)$('mlp').href='mailto:'+c.email;
tick();$('pl').hidden=!D.track;if(D.track)$('ptt').textContent=D.track.title;
document.querySelectorAll('.card').forEach(e=>io.observe(e))};
window.vid=id=>open(`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(D.videos[id].yt)}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe></div><h2>${esc(D.videos[id].title)}</h2>`);
window.photo=id=>open(`<img class="cv" style="aspect-ratio:auto;height:auto;margin:0" src="${esc(D.photos[id].src)}" alt="">`);
const tick=()=>{const c={...C0,...D.config},x=new Date(c.cdD).getTime()-Date.now(),ok=c.cdD&&x>0;$('cd').hidden=!ok;if(!ok)return;$('cdt').textContent=c.cdT;
$('cdn').innerHTML=[Math.floor(x/864e5),Math.floor(x/36e5)%24,Math.floor(x/6e4)%60,Math.floor(x/1e3)%60].map((n,i)=>`<div><b>${String(n).padStart(2,0)}</b><span>${['días','hrs','min','seg'][i]}</span></div>`).join('')};
setInterval(tick,1000);
const au=window.au=new Audio();let ctx,ana,fq,raf,ld=0;
const fm=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,0):'0:00';
$('pb').onclick=async()=>{if(!ld){$('ptm').textContent='cargando...';const s=await get(ref(db,'ZEKISCC_audio/data'));if(!s.exists()){$('ptm').textContent='';return}au.src=s.val();ld=1;$('ptm').textContent=''}
if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();const sr=ctx.createMediaElementSource(au);ana=ctx.createAnalyser();ana.fftSize=128;sr.connect(ana);ana.connect(ctx.destination);fq=new Uint8Array(ana.frequencyBinCount)}
await ctx.resume();au.paused?au.play():au.pause()};
au.onplay=au.onpause=au.onended=()=>{$('pb').innerHTML=ic(au.paused?'play':'ps');if(!au.paused)viz()};
au.ontimeupdate=()=>{$('sk').value=au.duration?au.currentTime/au.duration*1000:0;$('ptm').textContent=fm(au.currentTime)+' / '+fm(au.duration)};
$('sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
const cv=$('vz'),g=cv.getContext('2d');
function viz(){cancelAnimationFrame(raf);const f=()=>{ana.getByteFrequencyData(fq);g.clearRect(0,0,cv.width,cv.height);const w=cv.width/fq.length,col=getComputedStyle(document.documentElement).getPropertyValue('--a');fq.forEach((v,i)=>{const h=Math.max(3,v/255*cv.height);g.fillStyle=i%2?col:'#fff';g.fillRect(i*w+1,cv.height-h,w-3,h)});if(!au.paused)raf=requestAnimationFrame(f)};f()}
try{if(!location.search&&!sessionStorage.v){sessionStorage.v=1;runTransaction(ref(db,'ZEKISCC/views'),n=>(n||0)+1).catch(()=>{})}}catch(e){}
addEventListener('scroll',()=>{r(scrollY);$('bar').classList.toggle('on',!!window.lastId&&scrollY>innerHeight*.8&&!S.length)},{passive:true});
const r=y=>document.documentElement.style.setProperty('--sy',y);
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.tl');if(!c||e.pointerType!=='mouse')return;const b=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-b.left)/b.width-.5)*14+'deg');c.style.setProperty('--rx',-((e.clientY-b.top)/b.height-.5)*14+'deg')});
document.addEventListener('pointerout',e=>{const c=e.target.closest?.('.tl');if(c){c.style.removeProperty('--rx');c.style.removeProperty('--ry')}});
onValue(ref(db,'ZEKISCC'),s=>{D={config:{},songs:{},albums:{},photos:{},videos:{},shows:{},...s.val()};render();setTimeout(()=>$('ld').classList.add('off'),900)});
setTimeout(()=>$('ld').classList.add('off'),3500);
</script></body></html>
